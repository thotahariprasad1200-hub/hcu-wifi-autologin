plugins {
    id 'com.android.application'
}

android {
    namespace 'edu.uoh.hcuwifi'
    compileSdk 36

    defaultConfig {
        applicationId "edu.uoh.hcuwifi"
        minSdk 24
        targetSdk 36
        versionCode 12
        versionName "1.5.1"

        testInstrumentationRunner "android.test.InstrumentationTestRunner"
    }

    signingConfigs {
        release {
            storeFile file('hcuwifi.keystore')
            storePassword 'hcuwifi_keystore_pwd'
            keyAlias 'hcuwifi'
            keyPassword 'hcuwifi_keystore_pwd'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Ultra-lightweight: ZERO external dependencies (no androidx, no third-party libs)
    // Pure Android framework APIs + Keystore for sub-50 KB APK footprint!
}
