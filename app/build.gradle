plugins {
    id 'com.android.application'
}

android {
    namespace 'edu.uoh.hcuwifi'
    compileSdk 34

    defaultConfig {
        applicationId "edu.uoh.hcuwifi"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3.0"

        testInstrumentationRunner "android.test.InstrumentationTestRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Ultra-lightweight: ZERO external dependencies (no androidx, no third-party libs)
    // Pure Android framework APIs + Keystore for sub-50 KB APK footprint!
}
