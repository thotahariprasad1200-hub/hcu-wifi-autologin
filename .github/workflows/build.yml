name: Build and Release HCU Wi-Fi APK

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/HCU_WiFi_AutoLogin.apk
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HCU_WiFi_AutoLogin_APK
          path: dist/HCU_WiFi_AutoLogin.apk
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "HCU Wi-Fi Auto-Login v1.0.0"
          files: dist/HCU_WiFi_AutoLogin.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
